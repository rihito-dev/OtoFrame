name: C++ and WAV contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            portable: ON
          - os: windows-latest
            portable: ON
          - os: macos-latest
            portable: OFF
          - os: macos-latest
            portable: ON
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DOTOFRAME_PORTABLE=${{ matrix.portable }} -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
